<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 机器人头部 -->
  <rect x="8" y="10" width="16" height="14" rx="3" fill="url(#aiGradient)"/>
  
  <!-- 天线 -->
  <line x1="16" y1="10" x2="16" y2="6" stroke="url(#aiGradient)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="5" r="2" fill="url(#aiGradient)"/>
  
  <!-- 左眼 -->
  <circle cx="12" cy="15" r="2" fill="white"/>
  <circle cx="12.5" cy="15" r="1" fill="#667eea"/>
  
  <!-- 右眼 -->
  <circle cx="20" cy="15" r="2" fill="white"/>
  <circle cx="20.5" cy="15" r="1" fill="#667eea"/>
  
  <!-- 嘴巴 - 微笑曲线 -->
  <path d="M 11 20 Q 16 23 21 20" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- AI标识 -->
  <text x="16" y="29" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="url(#aiGradient)" text-anchor="middle">AI</text>
  
  <!-- 装饰性电路线条 -->
  <path d="M 6 16 L 8 16" stroke="#667eea" stroke-width="1.5" opacity="0.6"/>
  <path d="M 24 16 L 26 16" stroke="#667eea" stroke-width="1.5" opacity="0.6"/>
  <circle cx="5" cy="16" r="1" fill="#667eea" opacity="0.6"/>
  <circle cx="27" cy="16" r="1" fill="#667eea" opacity="0.6"/>
</svg>
