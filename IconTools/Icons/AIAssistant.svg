<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FC"/>
      <stop offset="100%" stop-color="#E5EAF0"/>
    </linearGradient>
    <linearGradient id="esriBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#0B4B8A"/>
    </linearGradient>
  </defs>
  <!-- Robot Head with subtle depth -->
  <rect x="5" y="8" width="22" height="18" rx="3" fill="url(#robotBody)" stroke="#2F3A45" stroke-width="1"/>
  <rect x="8" y="11" width="16" height="8" rx="1" fill="#FFFFFF" stroke="#2F3A45" stroke-width="0.5" opacity="0.8"/>
  <!-- Eyes with glow -->
  <circle cx="12" cy="15" r="2" fill="#1F6FEB"/>
  <circle cx="20" cy="15" r="2" fill="#1F6FEB"/>
  <circle cx="12.5" cy="14.5" r="0.5" fill="#FFFFFF"/>
  <circle cx="20.5" cy="14.5" r="0.5" fill="#FFFFFF"/>
  <!-- Antenna with signal -->
  <path d="M16 8V4" stroke="#2F3A45" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="3" r="2" fill="url(#esriBlue)" stroke="#0B3D6B" stroke-width="0.5"/>
  <!-- AI Text with better styling -->
  <text x="16" y="24" font-family="Segoe UI, Arial" font-size="6" font-weight="800" fill="#2F3A45" text-anchor="middle" letter-spacing="0.5">AI</text>
  <!-- Decorative base -->
  <path d="M9 26h14" stroke="#2F3A45" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
