<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="docBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#0B4B8A"/>
    </linearGradient>
    <linearGradient id="replaceOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- 背景文档（批量） -->
  <rect x="3" y="7" width="12" height="16" rx="1.2" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1"/>
  <rect x="3" y="7" width="12" height="3.6" rx="1.2" fill="#D7E7FF"/>

  <!-- 前景文档 -->
  <rect x="7" y="4" width="13" height="17" rx="1.4" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.1"/>
  <rect x="7" y="4" width="13" height="3.8" rx="1.4" fill="url(#docBlue)"/>
  <rect x="9.5" y="10.2" width="8" height="1.4" rx="0.7" fill="#E15759"/>
  <rect x="9.5" y="14.1" width="8" height="1.4" rx="0.7" fill="#22A06B"/>
  <path d="M18.2 11.1c1.1 0 1.8 0.8 1.8 1.7s-0.7 1.7-1.8 1.7" fill="none" stroke="url(#replaceOrange)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M17.1 13.7l1.6 0.8-1.6 0.8" fill="none" stroke="url(#replaceOrange)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A->B 规则区域 -->
  <rect x="22" y="7" width="8" height="5" rx="1.1" fill="#FFF7E6" stroke="#D97706" stroke-width="0.9"/>
  <rect x="22" y="17" width="8" height="5" rx="1.1" fill="#E8F3FF" stroke="#1F6FEB" stroke-width="0.9"/>
  <text x="26" y="10.7" fill="#B45309" font-family="Segoe UI, Arial" font-size="4.1" font-weight="bold" text-anchor="middle">A</text>
  <text x="26" y="20.7" fill="#1E5DBA" font-family="Segoe UI, Arial" font-size="4.1" font-weight="bold" text-anchor="middle">B</text>
  <path d="M26 12.9v2.6" stroke="#1F6FEB" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M24.8 14.7l1.2 1.2 1.2-1.2" fill="none" stroke="#1F6FEB" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 批量徽标 -->
  <circle cx="6" cy="24.5" r="3.4" fill="url(#docBlue)"/>
  <text x="6" y="26" fill="#FFFFFF" font-family="Segoe UI, Arial" font-size="4.5" font-weight="bold" text-anchor="middle">2</text>
