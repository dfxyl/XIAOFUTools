<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS AI Assistant</title>
    <link rel="stylesheet" href="style.css?v=20260209-2">
    <link rel="stylesheet" href="lib/github.min.css">
    <script src="lib/marked.min.js"></script>
    <script src="lib/highlight.min.js"></script>
</head>
<body>
    <!-- 头部 -->
    <div class="header">
        <div class="header-left">
            <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
        </div>
        <div class="header-title">
            <span>🤖</span> GIS Assistant
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="historyBtn" title="历史对话">📋</button>
            <button class="icon-btn" id="newBtn" title="新建会话">➕</button>
        </div>
    </div>

    <!-- 风险提示 -->
    <div class="risk-bar" id="privacyRiskBar">
        <span>⚠️ AI内容仅供参考，请勿输入敏感数据 · 敏感模式</span>
        <span class="risk-status on" id="sensitiveModeStatus">开启</span>
    </div>

    <!-- 历史对话面板 -->
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span class="history-title">历史对话</span>
            <button class="icon-btn" id="closeHistoryBtn" title="关闭">✕</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty">暂无历史对话</div>
        </div>
    </div>

    <!-- 消息列表 -->
    <div class="chat-list" id="chatList"></div>

    <!-- 回到底部按钮 -->
    <button class="scroll-to-bottom" id="scrollToBottomBtn" style="display: none;" title="回到底部">
        ↓
    </button>

    <!-- 输入区 -->
    <div class="input-area">
        <div class="input-container">
            <!-- 图片预览区 -->
            <div class="image-preview-container" id="imagePreviewContainer" style="display: none;"></div>
            
            <textarea id="input-text" rows="1" placeholder="输入您的问题... (Shift+Enter换行，/抓取 URL，可带 start/max/raw)"></textarea>
            <div class="input-footer">
                <div class="footer-left">
                    <!-- 图片上传按钮(仅支持视觉模型时显示) -->
                    <button class="icon-btn" id="imageUploadBtn" title="上传图片" style="display: none;">📎</button>
                    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                    <select id="modelSelect" class="model-select">
                        <option value="">加载中...</option>
                    </select>
                    <div class="mode-switch">
                        <span class="mode-label">Chat</span>
                        <label class="switch">
                            <input type="checkbox" id="modeToggle">
                            <span class="slider"></span>
                        </label>
                        <span class="mode-label">Agent</span>
                    </div>
                </div>
                <button id="sendBtn" title="发送">↵</button>
            </div>
        </div>
    </div>

    <!-- 自定义确认对话框 -->
    <div class="confirm-dialog-overlay" id="confirmDialog">
        <div class="confirm-dialog">
            <div class="confirm-dialog-header">
                <div class="confirm-dialog-title">
                    <span class="confirm-dialog-icon">⚠️</span>
                    <span>确认删除</span>
                </div>
            </div>
            <div class="confirm-dialog-body" id="confirmDialogBody">
                确定要删除会话 <span class="confirm-dialog-session-name" id="confirmDialogSessionName"></span> 吗？
            </div>
            <div class="confirm-dialog-footer">
                <button class="confirm-dialog-btn confirm-dialog-btn-cancel" id="confirmDialogCancel">取消</button>
                <button class="confirm-dialog-btn confirm-dialog-btn-confirm" id="confirmDialogConfirm">删除</button>
            </div>
        </div>
    </div>

    <!-- 工具调用确认对话框（非Agent模式） -->
    <div class="confirm-dialog-overlay" id="toolApprovalDialog">
        <div class="confirm-dialog tool-approval-dialog">
            <div class="confirm-dialog-header">
                <div class="confirm-dialog-title">
                    <span class="confirm-dialog-icon">🧰</span>
                    <span>工具调用确认</span>
                </div>
            </div>
            <div class="confirm-dialog-body" id="toolApprovalBody"></div>
            <div class="confirm-dialog-footer tool-approval-footer">
                <button class="confirm-dialog-btn confirm-dialog-btn-cancel" id="toolApprovalCancelBtn">取消</button>
                <button class="confirm-dialog-btn tool-approval-once-btn" id="toolApprovalAllowOnceBtn">本轮对话允许</button>
                <button class="confirm-dialog-btn tool-approval-allow-btn" id="toolApprovalAllowBtn">允许</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=20260209-2"></script>
</body>
</html>
